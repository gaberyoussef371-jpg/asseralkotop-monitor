name: Aseer Al Kotb Monitor

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab
    inputs:
      monitor_mode:
        description: "Products to check in this manual run"
        required: true
        default: TEST
        type: choice
        options:
          - TEST
          - FULL

concurrency:
  group: asseralkotop-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        
    - name: Run Monitor
      env:
        MONITOR_MODE: ${{ inputs.monitor_mode || vars.MONITOR_MODE }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        timeout --signal=TERM --kill-after=30s 160m python -u monitor.py
